name: Testy i kontrola jakości

on:
    push:
        branches: [main]
        paths-ignore:
            - '**/*.md'
    pull_request:
        branches: [main]
        paths-ignore:
            - '**/*.md'

# jabos - jakie zadania wykonujemy
jobs:
    testy:
        # runs-on - określa środowisko, w którym zadanie zostanie wykonane
        runs-on: ubuntu-24.04

        # steps - jakie kroki są do wykonania
        steps:
            - name: Pobranie kodu
              uses: actions/checkout@v4
            # uses - oznacza wykorzystanie akcji GitHub Actions
            # actions - 
            # checkout - nazwa akcji pobierającej kod
            # @v4 - wskazanie wersji akcji

            - name: Instalacja Pythona
              uses: actions/setup-python@v5
            # actions/setup-python@v5 - gotowa akcja służąca do przygotowania wskazanej wersji pythona
            # with przekazuje parametry do akcji
              with: 
                python-version: '3.15'

            - name: Instalacja zależności
              run: |
                python -m pip install --upgrade pip
                python -m pip install -r requirements.txt

            - name: Sprawdzenie jakości kodu
              run: python -m ruff check .

            - name: Uruchomienie testów
              run: python -m pytest -v




